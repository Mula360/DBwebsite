px\">\n                <span style=\"fontFamily:'Sora',sans-serif;fontSize:13px;fontWeight:600;color:#41514A\">Photograph<\u002Fspan>\n                <div style=\"padding:26px 20px;border:1.5px dashed #B9C8DC;borderRadius:12px;background:#F5F8F6;textAlign:center\">\n                  <div style=\"fontFamily:'Sora',sans-serif;fontSize:15.5px;fontWeight:600;color:#41514A\">Drop a JPEG here, or browse<\u002Fdiv>\n                  <div style=\"marginTop:6px;fontSize:14px;color:#5C6B63\">Up to 10 MB. Please keep the EXIF data intact.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Flabel>\n              <label style=\"display:flex;gap:11px;alignItems:flex-start;fontSize:15px;lineHeight:1.5;color:#5C6B63\">\n                <input type=\"checkbox\" style=\"marginTop:4px;width:17px;height:17px;flexShrink:0;accentColor:#2B72B8\">\n                I took this photograph and allow Deccan Birders to publish it with my credit.\n              <\u002Flabel>\n              <button style=\"justifySelf:start;padding:14px 28px;background:#2B72B8;color:#fff;border:0;borderRadius:999px;cursor:pointer;fontFamily:'Sora',sans-serif;fontSize:15.5px;fontWeight:600\" style-hover=\"background:#1F5A93\">Send for approval<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ══════════ ABOUT ══════════ -->\n    <sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"maxWidth:1180px;margin:0 auto;padding:clamp(40px,6vw,68px) 20px 0\">\n          <div style=\"fontFamily:'Sora',sans-serif;fontSize:12.5px;fontWeight:600;letterSpacing:0.1em;textTransform:uppercase;color:#2B72B8\">The society<\u002Fdiv>\n          <h1 style=\"margin:14px 0 0;fontFamily:'Sora',sans-serif;fontSize:clamp(34px,6vw,62px);lineHeight:1.04;letterSpacing:-0.035em;fontWeight:700\">About Us<\u002Fh1>\n        <\u002Fdiv>\n        <div style=\"maxWidth:1180px;margin:0 auto;padding:32px 20px 0\">\n          <img src=\"https://deccanbirders.org/wp-content/uploads/2024/01/Common-Rosefinch-2.jpg\" alt=\"Common Rosefinch\" style=\"width:100%;height:clamp(220px,38vw,440px);objectFit:cover;borderRadius:16px\">\n        <\u002Fdiv>\n        <div style=\"maxWidth:1180px;margin:0 auto;padding:clamp(40px,6vw,72px) 20px clamp(60px,8vw,96px);display:grid;gridTemplateColumns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(32px,5vw,64px);alignItems:start\">\n          <p style=\"margin:0;fontSize:clamp(19px,2.4vw,23px);lineHeight:1.55;letterSpacing:-0.01em;color:#16241D\">Deccan Birders is a non-governmental organization founded in 1980 (as Birdwatchers Society of Andhra Pradesh and renamed Deccan Birders in 2018) with the primary objective of spreading the message of bird conservation. Deccan Birders is registered under the Public Societies Registration Act – I of 1350F.<\u002Fp>\n          <div style=\"display:grid;gap:14px\">\n            <a href=\"#\" sc-camel-on-click=\"{{ goCommittee }}\" style=\"display:block;background:#fff;border:1px solid #DDE5DF;borderRadius:14px;padding:24px\" style-hover=\"borderColor:#2B72B8\">\n              <div style=\"fontFamily:'Sora',sans-serif;fontSize:19px;fontWeight:600;letterSpacing:-0.02em;color:#16241D\">Executive Committee →<\u002Fdiv>\n              <div style=\"marginTop:6px;fontSize:15.5px;color:#5C6B63\">The members who run the society.<\u002Fdiv>\n            <\u002Fa>\n            <a href=\"#\" sc-camel-on-click=\"{{ goAims }}\" style=\"display:block;background:#fff;border:1px solid #DDE5DF;borderRadius:14px;padding:24px\" style-hover=\"borderColor:#2B72B8\">\n              <div style=\"fontFamily:'Sora',sans-serif;fontSize:19px;fontWeight:600;letterSpacing:-0.02em;color:#16241D\">Aims and Objectives →<\u002Fdiv>\n              <div style=\"marginTop:6px;fontSize:15.5px;color:#5C6B63\">What we set out to do, in eight points.<\u002Fdiv>\n            <\u002Fa>\n            <div style=\"background:#EAF2FA;borderRadius:14px;padding:24px\">\n              <div style=\"fontSize:15.5px;lineHeight:1.6;color:#41514A\">For more details, contact <strong style=\"color:#16241D\">secretary@deccanbirders.org<\u002Fstrong>, <strong style=\"color:#16241D\">president@deccanbirders.org<\u002Fstrong>, or <strong style=\"color:#16241D\">treasurer@deccanbirders.org<\u002Fstrong><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ══════════ AIMS ══════════ -->\n    <sc-if value=\"{{ isAims }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"maxWidth:1180px;margin:0 auto;padding:clamp(40px,6vw,68px) 20px 0\">\n          <div style=\"fontFamily:'Sora',sans-serif;fontSize:12.5px;fontWeight:600;letterSpacing:0.1em;textTransform:uppercase;color:#2B72B8\">The society<\u002Fdiv>\n          <h1 style=\"margin:14px 0 0;fontFamily:'Sora',sans-serif;fontSize:clamp(32px,5.4vw,58px);lineHeight:1.04;letterSpacing:-0.035em;fontWeight:700\">Aims and Objectives<\u002Fh1>\n        <\u002Fdiv>\n        <div style=\"maxWidth:1180px;margin:0 auto;padding:32px 20px 0\">\n          <img src=\"https://deccanbirders.org/wp-content/uploads/2024/01/WhatsApp-Image-2024-01-26-at-12.24.03-PM-5.jpeg\" alt=\"Deccan Birders members in the field\" style=\"width:100%;height:clamp(200px,34vw,400px);objectFit:cover;borderRadius:16px\">\n        <\u002Fdiv>\n        <div style=\"maxWidth:1180px;margin:0 auto;padding:clamp(44px,6vw,80px) 20px clamp(60px,8vw,96px)\">\n          <ol style=\"listStyle:none;margin:0;display:grid;gridTemplateColumns:repeat(auto-fit,minmax(320px,1fr));gap:2px;background:#DDE5DF;border:1px solid #DDE5DF;borderRadius:16px;overflow:hidden\">\n            <sc-for list=\"{{ aims }}\" as=\"a\" hint-placeholder-count=\"8\">\n              <li style=\"background:#fff;padding:clamp(24px,3vw,34px);display:flex;gap:18px;alignItems:flex-start\">\n                <div style=\"flexShrink:0;fontFamily:'Sora',sans-serif;fontSize:14px;fontWeight:700;color:#17924C;width:30px;height:30px;borderRadius:99px;background:#E8F1EA;display:flex;alignItems:center;justifyContent:center\">{{ a.i }}<\u002Fdiv>\n                <div style=\"fontSize:17px;lineHeight:1.6;color:#2B3A33\">{{ a.text }}<\u002Fdiv>\n              <\u002Fli>\n            <\u002Fsc-for>\n          <\u002Fol>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ══════════ COMMITTEE ══════════ -->\n    <sc-if value=\"{{ isCommittee }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"maxWidth:1180px;margin:0 auto;padding:clamp(40px,6vw,68px) 20px 0\">\n          <div style=\"fontFamily:'Sora',sans-serif;fontSize:12.5px;fontWeight:600;letterSpacing:0.1em;textTransform:uppercase;color:#2B72B8\">The society<\u002Fdiv>\n          <h1 style=\"margin:14px 0 0;fontFamily:'Sora',sans-serif;fontSize:clamp(34px,6vw,62px);lineHeight:1.04;letterSpacing:-0.035em;fontWeight:700\">Executive Committee<\u002Fh1>\n          <p style=\"margin:20px 0 0;maxWidth:54ch;fontSize:clamp(17px,2.1vw,20px);lineHeight:1.55;color:#41514A\">Ten members, elected by the society, who run the trips, the newsletter and the census work.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"maxWidth:1180px;margin:0 auto;padding:32px 20px 0\">\n          <img src=\"https://deccanbirders.org/wp-content/uploads/2024/01/Lesser-Crested-Tern-1.jpg\" alt=\"Lesser Crested Tern\" style=\"width:100%;height:clamp(200px,32vw,380px);objectFit:cover;borderRadius:16px\">\n        <\u002Fdiv>\n        <div style=\"maxWidth:1180px;margin:0 auto;padding:clamp(44px,6vw,72px) 20px clamp(60px,8vw,96px);display:grid;gridTemplateColumns:repeat(auto-fit,minmax(250px,1fr));gap:20px\">\n          <sc-for list=\"{{ committee }}\" as=\"m\" hint-placeholder-count=\"8\">\n            <div style=\"background:#fff;border:1px solid #DDE5DF;borderRadius:16px;overflow:hidden;display:flex;flexDirection:column\">\n              <sc-if value=\"{{ m.photo }}\" hint-placeholder-val=\"{{ true }}\">\n                <img src=\"{{ m.photo }}\" alt=\"{{ m.name }}\" style=\"width:100%;height:230px;objectFit:cover;objectPosition:center 25%\">\n              <\u002Fsc-if>\n              <sc-if value=\"{{ m.noPhoto }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"width:100%;height:230px;background:#EAF2FA;display:flex;flexDirection:column;alignItems:center;justifyContent:center;gap:8px\">\n                  <div style=\"fontFamily:'Sora',sans-serif;fontSize:44px;fontWeight:700;letterSpacing:-0.04em;color:#6B857A\">{{ m.initials }}<\u002Fdiv>\n                  <div style=\"fontFamily:'Sora',sans-serif;fontSize:11px;fontWeight:600;letterSpacing:0.09em;textTransform:uppercase;color:#5C6B63\">Photograph to follow<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"padding:20px 22px 24px\">\n                <div style=\"fontFamily:'Sora',sans-serif;fontSize:11.5px;fontWeight:600;letterSpacing:0.09em;textTransform:uppercase;color:#2B72B8\">{{ m.role }}<\u002Fdiv>\n                <div style=\"marginTop:8px;fontFamily:'Sora',sans-serif;fontSize:20px;fontWeight:600;letterSpacing:-0.02em;lineHeight:1.2\">{{ m.name }}<\u002Fdiv>\n                <sc-if value=\"{{ m.hasEmail }}\" hint-placeholder-val=\"{{ true }}\">\n                  <a href=\"{{ m.mailto }}\" style=\"display:inline-block;marginTop:8px;fontSize:15px;color:#0F7A3E;wordBreak:break-all\">{{ m.email }}<\u002Fa>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ══════════ ACTIVITIES ══════════ -->\n    <sc-if value=\"{{ isActivities }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"maxWidth:1180px;margin:0 auto;padding:clamp(40px,6vw,68px) 20px clamp(36px,5vw,56px)\">\n          <div style=\"fontFamily:'Sora',sans-serif;fontSize:12.5px;fontWeight:600;letterSpacing:0.1em;textTransform:uppercase;color:#2B72B8\">Activities<\u002Fdiv>\n          <h1 style=\"margin:14px 0 0;maxWidth:22ch;fontFamily:'Sora',sans-serif;fontSize:clamp(34px,6vw,62px);lineHeight:1.04;letterSpacing:-0.035em;fontWeight:700\">An array of activities<\u002Fh1>\n          <p style=\"margin:22px 0 0;maxWidth:56ch;fontSize:clamp(18px,2.2vw,21px);lineHeight:1.55;color:#41514A\">Deccan Birders organizes field trips, lectures, film and slide shows, nature camps, treks, waterfowl counts, bird ringing, etc.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"maxWidth:1180px;margin:0 auto;padding:0 20px clamp(60px,8vw,96px);display:grid;gap:20px\">\n          <sc-for list=\"{{ activities }}\" as=\"a\" hint-placeholder-count=\"6\">\n            <div style=\"background:#fff;border:1px solid #DDE5DF;borderRadius:18px;overflow:hidden;display:grid;gridTemplateColumns:repeat(auto-fit,minmax(280px,1fr))\">\n              <div style=\"padding:clamp(26px,3.4vw,44px);display:flex;flexDirection:column;justifyContent:center;order:{{ a.textOrder }}\">\n                <div style=\"fontFamily:'Sora',sans-serif;fontSize:11.5px;fontWeight:600;letterSpacing:0.09em;textTransform:uppercase;color:#4E6B5C\">{{ a.cadence }}<\u002Fdiv>\n                <h2 style=\"margin:12px 0 0;fontFamily:'Sora',sans-serif;fontSize:clamp(24px,3vw,34px);lineHeight:1.12;letterSpacing:-0.03em;fontWeight:700\">{{ a.title }}<\u002Fh2>\n                <ul style=\"listStyle:none;margin:20px 0 0;display:grid;gap:11px\">\n                  <sc-for list=\"{{ a.points }}\" as=\"p\" hint-placeholder-count=\"3\">\n                    <li style=\"display:flex;gap:12px;alignItems:flex-start;fontSize:17px;lineHeight:1.5;color:#41514A\">\n                      <div style=\"marginTop:8px;width:6px;height:6px;flexShrink:0;borderRadius:99px;background:#2B72B8\"><\u002Fdiv>\n                      {{ p }}\n                    <\u002Fli>\n                  <\u002Fsc-for>\n                <\u002Ful>\n              <\u002Fdiv>\n              <img src=\"{{ a.photo }}\" alt=\"{{ a.title }}\" style=\"width:100%;height:100%;minHeight:260px;objectFit:cover;order:{{ a.imgOrder }}\">\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ══════════ ARCHIVES ══════════ -->\n    <sc-if value=\"{{ isArchives }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"maxWidth:1180px;margin:0 auto;padding:clamp(40px,6vw,68px) 20px 0\">\n          <div style=\"fontFamily:'Sora',sans-serif;fontSize:12.5px;fontWeight:600;letterSpacing:0.1em;textTransform:uppercase;color:#2B72B8\">Library<\u002Fdiv>\n          <h1 style=\"margin:14px 0 0;fontFamily:'Sora',sans-serif;fontSize:clamp(34px,6vw,62px);lineHeight:1.04;letterSpacing:-0.035em;fontWeight:700\">Archives<\u002Fh1>\n        <\u002Fdiv>\n        <div style=\"maxWidth:1180px;margin:0 auto;padding:32px 20px 0\">\n          <img src=\"https://deccanbirders.org/wp-content/uploads/2024/01/Indian-Roller-IMG_1027-554-D3-1024x608.jpg\" alt=\"Indian Roller\" style=\"width:100%;height:clamp(190px,30vw,340px);objectFit:cover;borderRadius:16px\">\n        <\u002Fdiv>\n\n        <div style=\"maxWidth:1180px;margin:0 auto;padding:clamp(44px,6vw,72px) 20px 0;display:grid;gridTemplateColumns:repeat(auto-fit,minmax(300px,1fr));gap:20px\">\n          <div style=\"background:#fff;border:1px solid #DDE5DF;borderRadius:16px;padding:28px\">\n            <h2 style=\"margin:0 0 16px;fontFamily:'Sora',sans-serif;fontSize:20px;fontWeight:600;letterSpacing:-0.02em\">Society<\u002Fh2>\n            <a href=\"https://deccanbirders.org/wp-content/uploads/2024/01/Byelaws2018.pdf\" style=\"display:block;fontSize:17px;lineHeight:1.5;borderBottom:1px solid #E7EDE9;paddingBottom:12px\">Memorandum Rules and Regulations<\u002Fa>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #DDE5DF;borderRadius:16px;padding:28px\">\n            <h2 style=\"margin:0 0 16px;fontFamily:'Sora',sans-serif;fontSize:20px;fontWeight:600;letterSpacing:-0.02em\">Publications<\u002Fh2>\n            <div style=\"display:grid;gap:12px\">\n              <div style=\"fontSize:16.5px;lineHeight:1.5;color:#41514A\">Aasheesh Pittie and Siraj A. Taher: <a href=\"https://drive.google.com/open?id=0B-u8pdUedG35RWtMOFB0WjNyblk\">Mid-winter Waterbird Census in Andhra Pradesh: 1987-1996<\u002Fa><\u002Fdiv>\n              <div style=\"fontSize:16.5px;lineHeight:1.5;color:#41514A\">Aasheesh Pittie: <a href=\"https://drive.google.com/open?id=0B-u8pdUedG35UjFUMXlKaDFtYTQ\">Checklist of birds of Andhra Pradesh (Version 1.1)<\u002Fa><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"maxWidth:1180px;margin:0 auto;padding:clamp(40px,5vw,64px) 20px clamp(60px,8vw,96px)\">\n          <h2 style=\"margin:0;fontFamily:'Sora',sans-serif;fontSize:clamp(26px,3.4vw,38px);letterSpacing:-0.03em;fontWeight:700\">PITTA Archives<\u002Fh2>\n          <p style=\"margin:12px 0 26px;fontSize:17px;color:#5C6B63;maxWidth:50ch\">Pick a year to see every issue. Issues from 2010–2013 are hosted on archive.org; later years on Google Drive.<\u002Fp>\n          <div style=\"display:grid;gap:10px\">\n            <sc-for list=\"{{ years }}\" as=\"y\" hint-placeholder-count=\"10\">\n              <div style=\"background:#fff;border:1px solid #DDE5DF;borderRadius:14px;overflow:hidden\">\n                <button sc-camel-on-click=\"{{ y.toggle }}\" style=\"width:100%;display:flex;alignItems:center;gap:16px;padding:20px 24px;background:transparent;border:0;cursor:pointer;textAlign:left;fontFamily:'Sora',sans-serif\" style-hover=\"background:#F5F8F6\">\n                  <span style=\"fontSize:clamp(22px,3vw,28px);fontWeight:700;letterSpacing:-0.03em;color:#16241D\">{{ y.year }}<\u002Fspan>\n                  <span style=\"fontSize:13.5px;fontWeight:600;color:#5C6B63;padding:4px 10px;background:#EAF2FA;borderRadius:999px\">{{ y.count }} issues<\u002Fspan>\n                  <span style=\"flex:1\"><\u002Fspan>\n                  <span style=\"fontSize:22px;color:#2B72B8;transform:rotate({{ y.rot }}deg);transition:transform .18s ease\">+<\u002Fspan>\n                <\u002Fbutton>\n                <sc-if value=\"{{ y.open }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"borderTop:1px solid #E7EDE9;padding:18px 24px 24px;display:grid;gridTemplateColumns:repeat(auto-fill,minmax(104px,1fr));gap:10px\">\n                    <sc-for list=\"{{ y.months }}\" as=\"m\" hint-placeholder-count=\"12\">\n                      <div style=\"display:grid;gap:6px\">\n                        <div style=\"fontFamily:'Sora',sans-serif;fontSize:11.5px;fontWeight:600;letterSpacing:0.08em;textTransform:uppercase;color:#5C6B63\">{{ m.name }}<\u002Fdiv>\n                        <sc-if value=\"{{ m.has }}\" hint-placeholder-val=\"{{ true }}\">\n                          <div style=\"display:flex;flexWrap:wrap;gap:6px\">\n                            <sc-for list=\"{{ m.links }}\" as=\"l\" hint-placeholder-count=\"1\">\n                              <a href=\"{{ l.url }}\" target=\"_blank\" rel=\"noopener\" style=\"display:block;padding:8px 12px;background:#E8F1EA;color:#0F7A3E;borderRadius:8px;fontFamily:'Sora',sans-serif;fontSize:13.5px;fontWeight:600\" style-hover=\"background:#0F7A3E;color:#fff\">{{ l.label }}<\u002Fa>\n                            <\u002Fsc-for>\n                          <\u002Fdiv>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ m.empty }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div style=\"padding:8px 12px;color:#6B857A;fontSize:13.5px\">—<\u002Fdiv>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ══════════ MEMBERSHIP ══════════ -->\n    <sc-if value=\"{{ isMembership }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <section style=\"position:relative;overflow:hidden;background:#16241D\">\n          <img src=\"https://deccanbirders.org/wp-content/uploads/2024/01/LSP-1.jpg\" alt=\"Long-tailed Shrike\" style=\"position:absolute;inset:0;width:100%;height:100%;objectFit:cover;opacity:0.5\">\n          <div style=\"position:absolute;inset:0;background:linear-gradient(to top, rgba(10,20,15,0.9), rgba(10,20,15,0.4))\"><\u002Fdiv>\n          <div style=\"position:relative;maxWidth:1180px;margin:0 auto;padding:clamp(72px,11vw,140px) 20px clamp(48px,7vw,80px)\">\n            <div style=\"fontFamily:'Sora',sans-serif;fontSize:12.5px;fontWeight:600;letterSpacing:0.1em;textTransform:uppercase;color:#F2B705\">Membership<\u002Fdiv>\n            <h1 style=\"margin:14px 0 0;maxWidth:20ch;fontFamily:'Sora',sans-serif;fontSize:clamp(34px,6vw,64px);lineHeight:1.04;letterSpacing:-0.035em;fontWeight:700;color:#fff\">Join 500+ members<\u002Fh1>\n            <p style=\"margin:20px 0 0;maxWidth:48ch;fontSize:clamp(17px,2.2vw,20px);lineHeight:1.55;color:rgba(255,255,255,0.86)\">Stay in the loop with everything you need to know about bird watching.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <div style=\"maxWidth:1180px;margin:0 auto;padding:clamp(44px,6vw,72px) 20px 0;display:grid;gridTemplateColumns:repeat(auto-fit,minmax(290px,1fr));gap:20px\">\n          <div style=\"background:#2B72B8;color:#fff;borderRadius:18px;padding:clamp(28px,3.4vw,40px);display:flex;flexDirection:column\">\n            <div style=\"fontFamily:'Sora',sans-serif;fontSize:11.5px;fontWeight:600;letterSpacing:0.09em;textTransform:uppercase;color:rgba(255,255,255,0.75)\">Option one<\u002Fdiv>\n            <h2 style=\"margin:12px 0 0;fontFamily:'Sora',sans-serif;fontSize:clamp(24px,3vw,30px);lineHeight:1.15;letterSpacing:-0.025em;fontWeight:700;color:#fff\">Apply online<\u002Fh2>\n            <p style=\"margin:12px 0 26px;fontSize:17px;lineHeight:1.55;color:rgba(255,255,255,0.88)\">Fill in the membership form in your browser. Takes about two minutes.<\u002Fp>\n            <div style=\"flex:1\"><\u002Fdiv>\n            <a href=\"https://docs.google.com/forms/d/e/1FAIpQLSdYVDlz8sCj-FJzUHayAGwxAYGE73PT2-QE3xTM4A8c06r7_A/viewform?usp=sf_link\" target=\"_blank\" rel=\"noopener\" style=\"alignSelf:flex-start;padding:14px 26px;background:#fff;color:#1F5A93;borderRadius:999px;fontFamily:'Sora',sans-serif;fontSize:15.5px;fontWeight:600\" style-hover=\"background:#F2B705;color:#16241D\">Apply for membership online<\u002Fa>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #DDE5DF;borderRadius:18px;padding:clamp(28px,3.4vw,40px);display:flex;flexDirection:column\">\n            <div style=\"fontFamily:'Sora',sans-serif;fontSize:11.5px;fontWeight:600;letterSpacing:0.09em;textTransform:uppercase;color:#4E6B5C\">Option two<\u002Fdiv>\n            <h2 style=\"margin:12px 0 0;fontFamily:'Sora',sans-serif;fontSize:clamp(24px,3vw,30px);lineHeight:1.15;letterSpacing:-0.025em;fontWeight:700\">Download the form<\u002Fh2>\n            <p style=\"margin:12px 0 26px;fontSize:17px;lineHeight:1.55;color:#41514A\">Download the membership form, fill it up, scan it and email it to us at the email ID given within.<\u002Fp>\n            <div style=\"flex:1\"><\u002Fdiv>\n            <a href=\"https://deccanbirders.org/wp-content/uploads/2024/01/DB_membershipForm.pdf\" target=\"_blank\" rel=\"noopener\" style=\"alignSelf:flex-start;padding:14px 26px;background:#16241D;color:#fff;borderRadius:999px;fontFamily:'Sora',sans-serif;fontSize:15.5px;fontWeight:600\" style-hover=\"background:#0F7A3E\">Download membership form (PDF)<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"maxWidth:1180px;margin:0 auto;padding:clamp(44px,6vw,80px) 20px clamp(60px,8vw,96px)\">\n          <h2 style=\"margin:0 0 28px;fontFamily:'Sora',sans-serif;fontSize:clamp(26px,3.4vw,38px);letterSpacing:-0.03em;fontWeight:700\">Membership Benefits<\u002Fh2>\n          <ul style=\"listStyle:none;margin:0;display:grid;gridTemplateColumns:repeat(auto-fit,minmax(260px,1fr));gap:2px;background:#DDE5DF;border:1px solid #DDE5DF;borderRadius:16px;overflow:hidden\">\n            <sc-for list=\"{{ benefits }}\" as=\"b\" hint-placeholder-count=\"8\">\n              <li style=\"background:#fff;padding:24px 26px;display:flex;gap:14px;alignItems:flex-start;fontSize:17px;lineHeight:1.5;color:#2B3A33\">\n                <div style=\"marginTop:7px;width:8px;height:8px;flexShrink:0;borderRadius:99px;background:#F2B705\"><\u002Fdiv>\n                {{ b }}\n              <\u002Fli>\n            <\u002Fsc-for>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n\n  <sc-if value=\"{{ showJoinBand }}\" hint-placeholder-val=\"{{ true }}\">\n    <section style=\"background:#EAF2FA;borderTop:1px solid #DDE5DF\">\n      <div style=\"maxWidth:1180px;margin:0 auto;padding:clamp(48px,7vw,84px) 20px;display:flex;flexWrap:wrap;gap:28px;alignItems:center;justifyContent:space-between\">\n        <div>\n          <h2 style=\"margin:0;fontFamily:'Sora',sans-serif;fontSize:clamp(28px,4vw,44px);lineHeight:1.08;letterSpacing:-0.03em;fontWeight:700\">Join 500+ members<\u002Fh2>\n          <p style=\"margin:12px 0 0;fontSize:clamp(17px,2vw,19px);lineHeight:1.5;color:#41514A;maxWidth:44ch\">Stay in the loop with everything you need to know about bird watching.<\u002Fp>\n        <\u002Fdiv>\n        <a href=\"#\" sc-camel-on-click=\"{{ goJoin }}\" style=\"padding:16px 30px;background:#0F7A3E;color:#fff;borderRadius:999px;fontFamily:'Sora',sans-serif;fontSize:16.5px;fontWeight:600\" style-hover=\"background:#0C6633\">Apply for Membership<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <footer style=\"background:#16241D;color:rgba(255,255,255,0.7) UAx6mleQ\")] }\n};\n\nconst AIMS = [\n  \"To inculcate in the people, especially the youth a spirit of adventure, a love and appreciation of the beauties of nature, especially the avifauna.\",\n  \"To impress upon the people the role of avifauna in life on earth and the urgent need for their protection and conservation.\",\n  \"To inculcate in the people a sense of responsibility towards maintaining the environment in a good state and the protection of the other inhabitants of this earth and particularly the avifauna.\",\n  \"To work for the protection and conservation of bird sanctuaries, parks and habitats generally all over India and particularly in Telangana and Andhra Pradesh.\",\n  \"To promote amongst the people, the knowledge of ornithology in all its branches including particularly the study of bird life of the Oriental Regions, particularly India and the adjoining zoo-geographical regions; both alive and otherwise.\",\n  \"To carry out research in all branches of ornithology and to assist with information and advice as well as financially where possible, other institutions and individual in similar pursuits.\",\n  \"To provide, equip, maintain and replenish a museum and other repositories for birds, both living and dead, which are suitable and necessary for the study of birds.\",\n  \"To do all or any of the above mentioned acts solely or with another or others, for joint management or collaboration or affiliation or any other arrangements with societies or persons having similar or allied objects which may further or benefit the objects of this Society.\"\n];\n\nconst U = \"https://deccanbirders.org/wp-content/uploads/\";\n\n// Images referenced from JS (gallery, videos, activities) are declared as\n// ext-resource-dependency metas in <helmet>; px() swaps in the inlined blob\n// URL when the page is published as a self-contained artifact.\nconst ASSET_ID = {};\n[\n  [\"img1\", \"2024/03/CREASTED-SERPENT-EAGLE-1-scaled-1-e1709461476180-1024x607.jpeg\"],\n \n  { setup: \"What is the difference between a birder and a twitcher?\", punch: \"The birder is late for dinner. The twitcher is late for the wedding.\" },\n  { setup: \"How many birders does it take to identify a warbler?\", punch: \"Four. One to see it, three to disagree.\" },\n  { setup: \"Overheard at Ameenpur\", punch: \"\\\"Lifer?\\\" \\\"No, just a pigeon in good light.\\\"\" },\n  { setup: \"Why did the ornithologist bring a ladder to the lake?\", punch: \"Somebody said the pelicans were high counts.\" },\n  { setup: \"What do you call a checklist with one house crow on it?\", punch: \"Optimistic.\" },\n  { setup: \"Why are owls terrible at meetings?\", punch: \"Every question gets the same answer.\" },\n  { setup: \"The census volunteer's paradox\", punch: \"You count 400 ducks. They count you back once.\" },\n  { setup: \"How do you know a birder has a new camera?\", punch: \"The bird is still a distant grey smudge, but at 60 megapixels.\" },\n  { setup: \"Why did the drongo join the field trip?\", punch: \"For the free insects the group kicked up.\" },\n  { setup: \"What is a birder's least favourite bird call?\", punch: \"The alarm at 4:30 am.\" },\n  { setup: \"Two birders in a hide\", punch: \"\\\"Anything?\\\" \\\"Three hours of nothing, beautifully.\\\"\" },\n  { setup: \"Why don't cranes use social media?\", punch: \"They prefer a long-distance call.\" }\n];\n\nconst FACTS = [\n  { title: \"The Indian Skimmer skims blind\", text: \"It flies with its longer lower mandible slicing the water surface, snapping shut on contact rather than on sight. Fewer than 2,500 are thought to remain, and the Manjeera reservoir is one of its strongholds.\" },\n  { title: \"Ameenpur is a biodiversity heritage site\", text: \"In 2016 Ameenpur Lake became the first urban water body in India to be notified a Biodiversity Heritage Site, on the strength of bird records largely gathered by amateur birdwatchers.\" },\n  { title: \"Painted Storks are silent\", text: \"Adults have almost no voice. Nesting colonies communicate by clattering their bills, which is why a heronry sounds like distant carpentry.\" },\n  { title: \"The Greater Flamingo is pale until it eats\", text: \"The pink comes from carotenoids in the algae and crustaceans it filters. Captive birds fed the wrong diet fade to white within a season.\" },\n  { title: \"Indian Pittas walk more than they fly\", text: \"Locally called the nine-coloured bird, it spends most of its time hopping through leaf litter. In the Deccan it announces the monsoon with a two-note whistle at dusk.\" },\n  { title: \"Spot-billed Pelicans nest in villages\", text: \"At Uppalapadu and Kolleru the colonies sit in trees over inhabited land. The villages have protected them for generations, which is why the counts there are among India's highest.\" },\n  { title: \"Cuckoos time their arrival\", text: \"The Asian Koel lays in crow nests and its eggs mimic the host's. It hatches earlier, so the chick is always the largest mouth in the nest.\" },\n  { title: \"Rollers roll for a reason\", text: \"The Indian Roller's tumbling flight is a courtship display, not a hunting move. It was Andhra Pradesh's state bird long before it became Telangana's.\" },\n  { title: \"Vultures find carcasses by sight\", text: \"Unlike New World vultures they have a poor sense of smell and rely on soaring height. India lost over 95% of its Gyps vultures to diclofenac in livestock within a decade.\" },\n  { title: \"Waders navigate by magnetism\", text: \"Species passing through Pulicat on the Central Asian Flyway carry a magnetic compass, calibrated against the setting sun in their first autumn.\" },\n  { title: \"A swift may not land for months\", text: \"Common Swifts feed, drink and sleep on the wing, touching down only to nest. Some individuals stay airborne for ten months at a stretch.\" },\n  { title: \"Bird ringing is a century old in India\", text: \"Recoveries of ringed birds first proved that ducks wintering on Deccan tanks breed in Central Asia, thousands of kilometres north.\" },\n  { title: \"Owls are asymmetric on purpose\", text: \"In several species one ear sits higher than the other, letting the bird triangulate a rustle in complete darkness to within a degree or two.\" }\n];\n\nconst ACTIVITIES = [\n  { title: \"Monthly Field Trips\", cadence: \"Every month\", points: [\"Visit to all the birding hot spots around Hyderabad\", \"Mingle with the experts\", \"Experience the joy of live bird sightings\"], photo: U + \"2024/01/WhatsApp-Image-2024-01-26-at-12.24.05-PM-3-e1709460443392-1024x607.jpeg\" },\n  { title: \"PITTA – Monthly Newsletter\", cadence: \"Twelve issues a year\", points: [\"Trip reports by members with great details and pictures\", \"Bird of the month column\", \"Opportunity to print your articles\"], photo: U + \"2024/01/WhatsApp-Image-2024-01-26-at-12.37.19-PM-e1709460540637.jpeg\" },\n  { title: \"Annual Bird Race\", cadence: \"Once a year\", points: [\"Full day birding with an assigned team\", \"Team with the maximum sightings wins\", \"Sumptuous dinner to celebrate the day\"], photo: U + \"2024/01/1a807252-7136-47ac-97a2-9e8581f0f53b-e1709460399688-1024x607.jpeg\" },\n  { title: \"Annual Waterfowl Census\", cadence: \"Every winter\", points: [\"Census performed every Winter season.\", \"Volunteering opportunity to do the census.\", \"Data submitted to Wetlands International.\"], photo: U + \"2024/01/52e3a4b4-d6b4-49f4-af7c-dc33a48321ce-e1709460711843.jpeg\" },\n  { title: \"Webinars\", cadence: \"Through the year\", points: [\"Talks by eminent ornithologists.\", \"Network with the experts\", \"Become aware of the latest developments.\"], photo: U + \"2024/01/WhatsApp-Image-2024-01-26-at-12.24.03-PM-4-1024x576.jpeg\" },\n  { title: \"Annual Nature Camps and Trekking\", cadence: \"Once a year\", points: [\"National and International camps\", \"Focus on the bird watching.\", \"Exclusive access to sanctuaries wherever possible.\"], photo: U + \"2024/03/CREA "),\n      goGallery: this.go(\"gallery\"),\n\n      events: EVENTS,\n      eventsHome: EVENTS.slice(0, 3),\n      gallery: GALLERY.map((g) => ({ ...g, src: px(g.src), by: g.by || \"Deccan Birders member\" })),\n      galleryStrip: GALLERY.slice(0, 5).map((g) => ({ ...g, src: px(g.src) })),\n\n      regions: [[\"IN-TG\", \"Telangana\"], [\"IN-AP\", \"Andhra Pradesh\"]].map(([code, label]) => ({\n        label, code,\n        on: this.state.region === code,\n        bg: this.state.region === code ? \"#16241D\" : \"transparent\",\n        fg: this.state.region === code ? \"#ffffff\" : \"#5C6B63\",\n        pick: () => this.setState({ region: code })\n      })),\n      regionLabel: SIGHTINGS[this.state.region].label,\n\n      tabs: [[\"notable\", \"Notable\"], [\"recent\", \"All recent\"], [\"hotspots\", \"Hotspots\"]].map(([key, label]) => ({\n        label,\n        fg: this.state.tab === key ? \"#16241D\" : \"#5C6B63\",\n        bar: this.state.tab === key ? 1 : 0,\n        pick: () => this.setState({ tab: key })\n      })),\n      showNotable: this.state.tab === \"notable\",\n      showRecent: this.state.tab === \"recent\",\n      showHotspots: this.state.tab === \"hotspots\",\n      notable: SIGHTINGS[this.state.region].notable,\n      recent: SIGHTINGS[this.state.region].recent,\n      recentHome: SIGHTINGS[this.state.region].recent.slice(0, 4),\n      hotspots: SIGHTINGS[this.state.region].hotspots.map((h, i) => {\n        const list = HOTSPOT_SPECIES[h.name] || [];\n        const open = this.state.hotspot === h.name;\n        return {\n          ...h, rank: i + 1, open, rot: open ? 45 : 0,\n          speciesList: list,\n          more: String(Math.max(0, parseInt(h.species, 10) - list.length)),\n          toggle: () => this.setState((s) => ({ hotspot: s.hotspot === h.name ? null : h.name }))\n        };\n      }),\n\n      onThisDay: ON_THIS_DAY.map((o) => ({ ...o, tally: o.count === \"1\" ? \"1 bird\" : o.count + \" birds\" })),\n      todayLabel: (() => {\n        const d = new Date();\n        const full = [\"January\",\"February\",\"March\",\"April\",\"May\",\"June\",\"July\",\"August\",\"September\",\"October\",\"November\",\"December\"];\n        return d.getDate() + \" \" + full[d.getMonth()];\n      })(),\n\n      query: this.state.query,\n      onQuery: (e) => this.setState({ query: e.target.value, species: null }),\n      suggestions: (() => {\n        const q = (this.state.query || \"\").trim().toLowerCase();\n        if (!q || this.state.species) return [];\n        return SPECIES_INDEX.filter((s) => s.name.toLowerCase().indexOf(q) > -1).slice(0, 6)\n          .map((s) => ({ name: s.name, pick: () => this.setState({ species: s.name, query: s.name }) }));\n      })(),\n      hasSpecies: !!this.state.species,\n      speciesName: this.state.species || \"\",\n      nearest: (() => {\n        const s = SPECIES_INDEX.filter((x) => x.name === this.state.species)[0];\n        if (!s) return [];\n        return s.near.map((n) => ({ loc: n[0], dist: n[1], when: n[2], count: n[3] }));\n      })(),\n      clearSpecies: () => this.setState({ species: null, query: \"\" }),\n\n      stats: [\n        { n: \"1980\", label: \"Founded, as the Birdwatchers Society of Andhra Pradesh\" },\n        { n: \"500+\", label: \"Members across the Deccan and beyond\" },\n        { n: \"12\", label: \"Issues of PITTA published every year\" },\n        { n: \"45\", label: \"Years of field records and waterfowl counts\" }\n      ],\n\n      activityBrief: ACTIVITIES.map((a) => ({ title: a.title, cadence: a.cadence })),\n      activities: ACTIVITIES.map((a, i) => ({ ...a, photo: px(a.photo), textOrder: i % 2 === 0 ? 1 : 2, imgOrder: i % 2 === 0 ? 2 : 1 })),\n\n      pittaPoints: [\n        \"Trip reports by members with great details and pictures\",\n        \"Bird of the month column\",\n        \"Opportunity to print your articles\"\n      ],\n\n      aims: AIMS.map((text, i) => ({ i: i + 1, text })),\n\n      committee: COMMITTEE.map((m) => ({\n        ...m,\n        photo: null,\n        noPhoto: true,\n        hasEmail: !!m.email,\n        mailto: m.email ? \"mailto:\" + m.email : \"#\",\n        initials: m.name.replace(/^Dr\\.\\s*/, \"\").split(/[\\s.]+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join(\"\")\n      })),\n\n      humour: HUMOUR[this.weekIndex() % HUMOUR.length],\n      fact: FACTS[this.weekIndex() % FACTS.length],\n      weekLabel: this.weekLabel(),\n      submitNotes: [\n        \"Tell us the name you would like the credit to read.\",\n        \"One bird per frame, no baiting, no nest photography during breeding.\",\n        \"Approvals usually take a week; you'll hear back either way.\"\n      ],\n\n      videos: VIDEOS.map((v) => ({ ...v, thumb: px(v.thumb) })),\n      noop: (e) => { if (e) e.preventDefault(); },\n      galleryTabs: [[\"photos\", \"Photographs\"], [\"videos\", \"Videos\"]].map(([key, label]) => ({\n        label,\n        fg: this.state.galleryTab === key ? \"#16241D\" : \"#5C6B63\",\n        bar: this.state.galleryTab === key ? 1 : 0,\n        pick: () => this.setState({ galleryTab: key })\n      })),\n      showPhotos: this.state.galleryTab === \"photos\",\n      showVideos: this.state.galleryTab === \"videos\",\n\n      benefits: BENEFITS,\n\n      years: [2019, 2018, 2017, 2016, 2015, 2014, 2013, 2012, 2011, 2010].map((y) => this.buildYear(y))\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
