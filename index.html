  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  // Error sink persists across replaceWith since it's on window, not the DOM.

    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

relative;maxWidth:1180px;margin:0 auto;padding:80px 20px 56px;width:100%\">\n            <div style=\"display:inline-flex;alignItems:center;gap:9px;padding:7px 14px;borderRadius:999px;background:rgba(242,183,5,0.16);border:1px solid rgba(242,183,5,0.5);marginBottom:22px\">\n              <div style=\"width:7px;height:7px;borderRadius:99px;background:#F2B705\"><\u002Fdiv>\n              <span style=\"fontFamily:'Sora',sans-serif;fontSize:12.5px;fontWeight:600;letterSpacing:0.08em;textTransform:uppercase;color:#F7D775\">Founded 1980 · Hyderabad<\u002Fspan>\n            <\u002Fdiv>\n            <h1 style=\"margin:0;maxWidth:19ch;fontFamily:'Sora',sans-serif;fontSize:clamp(38px,7vw,76px);lineHeight:1.02;letterSpacing:-0.035em;fontWeight:700;color:#fff;textWrap:balance\">Spreading the message of bird conservation.<\u002Fh1>\n            <p style=\"margin:24px 0 0;maxWidth:54ch;fontSize:clamp(17px,2.2vw,20px);lineHeight:1.55;color:rgba(255,255,255,0.86)\">Deccan Birders is a non-governmental organization with the primary objective of spreading the message of bird conservation across Telangana, Andhra Pradesh and India.<\u002Fp>\n            <div style=\"display:flex;flexWrap:wrap;gap:12px;marginTop:34px\">\n              <a href=\"#\" sc-camel-on-click=\"{{ goJoin }}\" style=\"padding:15px 28px;background:#2B72B8;color:#fff;borderRadius:999px;fontFamily:'Sora',sans-serif;fontSize:16px;fontWeight:600\" style-hover=\"background:#1F5A93\">Apply for membership<\u002Fa>\n              <a href=\"#\" sc-camel-on-click=\"{{ goActivities }}\" style=\"padding:15px 28px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.35);color:#fff;borderRadius:999px;fontFamily:'Sora',sans-serif;fontSize:16px;fontWeight:600\" style-hover=\"background:rgba(255,255,255,0.2)\">See our activities<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section style=\"borderBottom:1px solid #DDE5DF;background:#fff\">\n          <div style=\"maxWidth:1180px;margin:0 auto;padding:0 20px;display:grid;gridTemplateColumns:repeat(auto-fit,minmax(200px,1fr))\">\n            <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"padding:34px 24px 34px 0;borderRight:1px solid #E7EDE9\">\n                <div style=\"fontFamily:'Sora',sans-serif;fontSize:clamp(32px,4.4vw,46px);fontWeight:700;letterSpacing:-0.04em;color:#17924C;lineHeight:1\">{{ s.n }}<\u002Fdiv>\n                <div style=\"marginTop:8px;fontSize:15px;lineHeight:1.4;color:#5C6B63;maxWidth:22ch\">{{ s.label }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section style=\"maxWidth:1180px;margin:0 auto;padding:clamp(56px,8vw,96px) 20px 0\">\n          <div style=\"display:flex;flexWrap:wrap;gap:20px;alignItems:flex-end;justifyContent:space-between;marginBottom:30px\">\n            <div>\n              <div style=\"fontFamily:'Sora',sans-serif;fontSize:12.5px;fontWeight:600;letterSpacing:0.1em;textTransform:uppercase;color:#2B72B8;marginBottom:14px\">Upcoming<\u002Fdiv>\n              <h2 style=\"margin:0;fontFamily:'Sora',sans-serif;fontSize:clamp(28px,4vw,44px);lineHeight:1.06;letterSpacing:-0.03em;fontWeight:700\">Come out with us<\u002Fh2>\n              <p style=\"margin:14px 0 0;maxWidth:46ch;fontSize:17.5px;lineHeight:1.55;color:#41514A\">Trips run most weekends. Turn up, borrow a pair of binoculars, and put your name on the checklist.<\u002Fp>\n            <\u002Fdiv>\n            <a href=\"#\" sc-camel-on-click=\"{{ goActivities }}\" style=\"fontFamily:'Sora',sans-serif;fontSize:15.5px;fontWeight:600;color:#0F7A3E;borderBottom:2px solid #F2B705;paddingBottom:3px\">Full calendar →<\u002Fa>\n          <\u002Fdiv>\n          <div style=\"display:grid;gridTemplateColumns:repeat(auto-fit,minmax(260px,1fr));gap:14px\">\n            <sc-for list=\"{{ eventsHome }}\" as=\"e\" hint-placeholder-count=\"3\">\n              <div style=\"background:#fff;border:1px solid #DDE5DF;borderRadius:16px;padding:24px;display:flex;gap:18px;alignItems:flex-start\" style-hover=\"borderColor:#2B72B8\">\n                <div style=\"flexShrink:0;width:60px;textAlign:center;background:#EAF2FA;borderRadius:12px;padding:10px 0\">\n                  <div style=\"fontFamily:'Sora',sans-serif;fontSize:24px;fontWeight:700;letterSpacing:-0.04em;lineHeight:1;color:#16241D\">{{ e.d }}<\u002Fdiv>\n                  <div style=\"marginTop:3px;fontFamily:'Sora',sans-serif;fontSize:11.5px;fontWeight:600;letterSpacing:0.08em;textTransform:uppercase;color:#4E6B5C\">{{ e.mo }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div>\n                  <div style=\"fontFamily:'Sora',sans-serif;fontSize:17.5px;fontWeight:600;letterSpacing:-0.02em;lineHeight:1.25\">{{ e.title }}<\u002Fdiv>\n                  <div style=\"marginTop:8px;fontSize:15px;lineHeight:1.5;color:#5C6B63\">{{ e.place }}<\u002Fdiv>\n                  <div style=\"marginTop:2px;fontSize:15px;lineHeight:1.5;color:#5C6B63\">{{ e.time }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section style=\"maxWidth:1180px;margin:0 auto;padding:clamp(60px,9vw,110px) 20px\">\n          <div style=\"display:grid;gridTemplateColumns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(32px,5vw,72px);alignItems:start\">\n            <div>\n              <div style=\"fontFamily:'Sora',sans-serif;fontSize:12.5px;fontWeight:600;letterSpacing:0.1em;textTransform:uppercase;color:#2B72B8;marginBottom:18px\">What we do<\u002Fdiv>\n              <h2 style=\"margin:0;fontFamily:'Sora',sans-serif;fontSize:clamp(30px,4.4vw,50px);lineHeight:1.06;letterSpacing:-0.03em;fontWeight:700;textWrap:balance\">An array of activities<\u002Fh2>\n              <p style=\"margin:22px 0 0;fontSize:18px;lineHeight:1.62;color:#41514A;maxWidth:44ch\">Deccan Birders organizes field trips, lectures, film and slide shows, nature camps, treks, waterfowl counts, bird ringing, etc.<\u002Fp>\n              <a href=\"#\" sc-camel-on-click=\"{{ goActivities }}\" style=\"display:inline-block;marginTop:26px;fontFamily:'Sora',sans-serif;fontSize:15.5px;fontWeight:600;color:#0F7A3E;borderBottom:2px solid #F2B705;paddingBottom:3px\">All activities →<\u002Fa>\n            <\u002Fdiv>\n            <div style=\"display:grid;gridTemplateColumns:repeat(auto-fit,minmax(230px,1fr));gap:14px\">\n              <sc-for list=\"{{ activityBrief }}\" as=\"a\" hint-placeholder-count=\"6\">\n                <div style=\"background:#fff;border:1px solid #DDE5DF;borderRadius:14px;padding:22px\" style-hover=\"borderColor:#2B72B8\">\n                  <div style=\"fontFamily:'Sora',sans-serif;fontSize:11.5px;fontWeight:600;letterSpacing:0.08em;textTransform:uppercase;color:#4E6B5C\">{{ a.cadence }}<\u002Fdiv>\n                  <div style=\"marginTop:10px;fontFamily:'Sora',sans-serif;fontSize:18px;fontWeight:600;letterSpacing:-0.015em;lineHeight:1.25\">{{ a.title }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section style=\"background:#16241D;color:#fff\">\n          <div style=\"maxWidth:1180px;margin:0 auto;padding:clamp(56px,8vw,96px) 20px;display:grid;gridTemplateColumns:repeat(auto-fit,minmax(290px,1fr));gap:clamp(32px,5vw,64px);alignItems:center\">\n            <div>\n              <div style=\"fontFamily:'Sora',sans-serif;fontSize:12.5px;fontWeight:600;letterSpacing:0.1em;textTransform:uppercase;color:#F2B705;marginBottom:18px\">PITTA · Monthly newsletter<\u002Fdiv>\n              <h2 style=\"margin:0;fontFamily:'Sora',sans-serif;fontSize:clamp(28px,4vw,44px);lineHeight:1.08;letterSpacing:-0.03em;fontWeight:700;color:#fff\">Forty-five years of trip reports, in one archive.<\u002Fh2>\n              <ul style=\"listStyle:none;margin:26px 0 0;display:grid;gap:12px\">\n                <sc-for list=\"{{ pittaPoints }}\" as=\"p\" hint-placeholder-count=\"3\">\n                  <li style=\"display:flex;gap:12px;alignItems:flex-start;fontSize:17px;lineHeight:1.5;color:rgba(255,255,255,0.82)\">\n                    <div style=\"marginTop:8px;width:6px;height:6px;flexShrink:0;borderRadius:99px;background:#2B72B8\"><\u002Fdiv>\n                    {{ p }}\n                  <\u002Fli>\n                <\u002Fsc-for>\n              <\u002Ful>\n              <a href=\"#\" sc-camel-on-click=\"{{ goArchives }}\" style=\"display:inline-block;marginTop:30px;padding:14px 26px;background:#fff;color:#16241D;borderRadius:999px;fontFamily:'Sora',sans-serif;fontSize:15.5px;fontWeight:600\" style-hover=\"background:#F2B705\">Browse PITTA archives<\u002Fa>\n            <\u002Fdiv>\n            <div style=\"display:grid;gridTemplateColumns:1fr 1fr;gap:12px\">\n              <img src=\"https://deccanbirders.org/wp-content/uploads/2024/01/WhatsApp-Image-2024-01-26-at-12.37.19-PM-e1709460540637.jpeg\" alt=\"Members on a field trip\" style=\"width:100%;height:100%;minHeight:150px;objectFit:cover;borderRadius:12px;gridRow:span 2\">\n              <img src=\"https://deccanbirders.org/wp-content/uploads/2024/01/Common-Rosefinch-2.jpg\" alt=\"Common Rosefinch\" style=\"width:100%;height:100%;minHeight:110px;objectFit:cover;borderRadius:12px\">\n              <img src=\"https://deccanbirders.org/wp-content/uploads/2024/01/Indian-Roller-IMG_1027-554-D3-1024x608.jpg\" alt=\"Indian Roller\" style=\"width:100%;height:100%;minHeight:110px;objectFit:cover;borderRadius:12px\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n        <section style=\"maxWidth:1180px;margin:0 auto;padding:clamp(60px,9vw,104px) 20px 0\">\n          <div style=\"display:flex;flexWrap:wrap;gap:16px;alignItems:flex-end;justifyContent:space-between;marginBottom:26px\">\n            <div>\n              <div style=\"fontFamily:'Sora',sans-serif;fontSize:12.5px;fontWeight:600;letterSpacing:0.1em;textTransform:uppercase;color:#2B72B8;marginBottom:14px\">Live from eBird · {{ regionLabel }}<\u002Fdiv>\n              <h2 style=\"margin:0;fontFamily:'Sora',sans-serif;fontSize:clamp(28px,4vw,44px);lineHeight:1.06;letterSpacing:-0.03em;fontWeight:700\">What's being seen right now<\u002Fh2>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:4px;padding:4px;background:#EAF2FA;borderRadius:999px\">\n              <sc-for list=\"{{ regions }}\" as=\"r\" hint-placeholder-count=\"2\">\n                <button sc-camel-on-click=\"{{ r.pick }}\" style=\"padding:9px 18px;border:0;cursor:pointer;borderRadius:999px;fontFamily:'Sora',sans-serif;fontSize:14px;fontWeight:600;background:{{ r.bg }};color:{{ r.fg }}\">{{ r.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flexWrap:wrap;gap:2px;background:#DDE5DF;border:1px solid #DDE5DF;borderRadius:16px;overflow:hidden\">\n            <sc-for list=\"{{ recentHome }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"flex:1 1 230px;background:#fff;padding:24px\">\n                <div style=\"fontFamily:'Sora',sans-serif;fontSize:17.5px;fontWeight:600;letterSpacing:-0.02em;lineHeight:1.25\">{{ s.species }}<\u002Fdiv>\n                <div style=\"marginTop:10px;fontSize:15px;color:#5C6B63\">{{ s.loc }}<\u002Fdiv>\n                <div style=\"marginTop:12px;display:flex;gap:8px;alignItems:center\">\n                  <span style=\"padding:3px 9px;background:#E8F1EA;color:#0F7A3E;borderRadius:999px;fontFamily:'Sora',sans-serif;fontSize:12.5px;fontWeight:600\">{{ s.count }}<\u002Fspan>\n                  <span style=\"fontSize:13.5px;color:#5C6B63\">{{ s.obs }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <a href=\"#\" sc-camel-on-click=\"{{ goSightings }}\" style=\"display:inline-block;marginTop:22px;fontFamily:'Sora',sans-serif;fontSize:15.5px;fontWeight:600;color:#0F7A3E;borderBottom:2px solid #F2B705;paddingBottom:3px\">Notable sightings and hotspots →<\u002Fa>\n        <\u002Fsection>\n\n        <section style=\"maxWidth:1180px;margin:0 auto;padding:clamp(60px,9vw,104px) 20px 0\">\n          <div style=\"display:flex;flexWrap:wrap;gap:14px;alignItems:baseline;justifyContent:space-between;marginBottom:26px\">\n            <h2 style=\"margin:0;fontFamily:'Sora',sans-serif;fontSize:clamp(28px,4vw,44px);lineHeight:1.06;letterSpacing:-0.03em;fontWeight:700\">This week at the hide<\u002Fh2>\n            <div style=\"fontFamily:'Sora',sans-serif;fontSize:13.5px;fontWeight:600;letterSpacing:0.04em;color:#5C6B63\">{{ weekLabel }} · changes every Monday<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;gridTemplateColumns:repeat(auto-fit,minmax(300px,1fr));gap:16px\">\n            <div style=\"background:#F2B705;borderRadius:18px;padding:clamp(28px,3.6vw,42px);display:flex;flexDirection:column\">\n              <div style=\"fontFamily:'Sora',sans-serif;fontSize:12px;fontWeight:600;letterSpacing:0.09em;textTransform:uppercase;color:#4A3800;marginBottom:20px\">Bird Humour<\u002Fdiv>\n              <div style=\"fontFamily:'Sora',sans-serif;fontSize:clamp(20px,2.5vw,26px);lineHeight:1.25;letterSpacing:-0.02em;fontWeight:600;color:#2E2200\">{{ humour.setup }}<\u002Fdiv>\n              <div style=\"flex:1;minHeight:18px\"><\u002Fdiv>\n              <div style=\"fontSize:clamp(17px,2.1vw,20px);lineHeight:1.5;color:#4A3800\">{{ humour.punch }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#0F7A3E;borderRadius:18px;padding:clamp(28px,3.6vw,42px);display:flex;flexDirection:column\">\n              <div style=\"fontFamily:'Sora',sans-serif;fontSize:12px;fontWeight:600;letterSpacing:0.09em;textTransform:uppercase;color:#ffffff;marginBottom:20px\">Bird Fact<\u002Fdiv>\n              <div style=\"fontFamily:'Sora',sans-serif;fontSize:clamp(20px,2.5vw,26px);lineHeight:1.25;letterSpacing:-0.02em;fontWeight:600;color:#fff\">{{ fact.title }}<\u002Fdiv>\n              <div style=\"flex:1;minHeight:18px\"><\u002Fdiv>\n              <div style=\"fontSize:clamp(16px,2vw,18px);lineHeight:1.55;color:#fff\">{{ fact.text }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#16241D;borderRadius:18px;padding:clamp(28px,3.6vw,42px);display:flex;flexDirection:column\">\n              <div style=\"fontFamily:'Sora',sans-serif;fontSize:12px;fontWeight:600;letterSpacing:0.09em;textTransform:uppercase;color:#F2B705;marginBottom:20px\">On this day · {{ todayLabel }}<\u002Fdiv>\n              <div style=\"display:grid;gap:14px\">\n                <sc-for list=\"{{ onThisDay }}\" as=\"o\" hint-placeholder-count=\"5\">\n                  <div style=\"display:flex;gap:16px;alignItems:baseline\">\n                    <div style=\"fontFamily:'Sora',sans-serif;fontSize:15px;fontWeight:700;letterSpacing:-0.02em;color:#F2B705;minWidth:42px\">{{ o.year }}<\u002Fdiv>\n                    <div>\n                      <div style=\"fontFamily:'Sora',sans-serif;fontSize:16px;fontWeight:600;letterSpacing:-0.015em;color:#fff;lineHeight:1.25\">{{ o.species }}<\u002Fdiv>\n                      <div style=\"marginTop:3px;fontSize:14px;color:rgba(255,255,255,0.7)\">{{ o.loc }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"flex:1;minHeight:14px\"><\u002Fdiv>\n              <a href=\"#\" sc-camel-on-click=\"{{ goSightings }}\" style=\"fontFamily:'Sora',sans-serif;fontSize:14.5px;fontWeight:600;color:#F2B705\">More from the archive →<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section style=\"maxWidth:1180px;margin:0 auto;padding:clamp(60px,9vw,104px) 20px clamp(20px,3vw,40px)\">\n          <div style=\"display:flex;flexWrap:wrap;gap:16px;alignItems:flex-end;justifyContent:space-between;marginBottom:26px\">\n            <h2 style=\"margin:0;fontFamily:'Sora',sans-serif;fontSize:clamp(28px,4vw,44px);lineHeight:1.06;letterSpacing:-0.03em;fontWeight:700\">From members' cameras<\u002Fh2>\n            <a href=\"#\" sc-camel-on-click=\"{{ goGallery }}\" style=\"fontFamily:'Sora',sans-serif;fontSize:15.5px;fontWeight:600;color:#0F7A3E;borderBottom:2px solid #F2B705;paddingBottom:3px\">Full gallery →<\u002Fa>\n          <\u002Fdiv>\n          <div style=\"display:grid;gridTemplateColumns:repeat(auto-fit,minmax(180px,1fr));gap:12px\">\n            <sc-for list=\"{{ galleryStrip }}\" as=\"g\" hint-placeholder-count=\"5\">\n              <img src=\"{{ g.src }}\" alt=\"{{ g.title }}\" style=\"width:100%;height:clamp(160px,20vw,230px);objectFit:cover;borderRadius:12px\">\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ══════════ SIGHTINGS ══════════ -->\n    <sc-if value=\"{{ isSightings }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"maxWidth:1180px;margin:0 auto;padding:clamp(40px,6vw,68px) 20px 0\">\n          <div style=\"fontFamily:'Sora',sans-serif;fontSize:12.5px;fontWeight:600;letterSpacing:0.1em;textTransform:uppercase;color:#2B72B8\">Live from eBird<\u002Fdiv>\n          <h1 style=\"margin:14px 0 0;fontFamily:'Sora',sans-serif;fontSize:clamp(34px,6vw,62px);lineHeight:1.04;letterSpacing:-0.035em;fontWeight:700\">Recent Sightings<\u002Fh1>\n          <p style=\"margin:20px 0 0;maxWidth:56ch;fontSize:clamp(17px,2.1vw,20px);lineHeight:1.55;color:#41514A\">Every record below is pulled from checklists submitted to eBird for the region. Submit yours and it appears here.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"maxWidth:1180px;margin:0 auto;padding:32px 20px 0;display:flex;flexWrap:wrap;gap:16px;alignItems:center;justifyContent:space-between\">\n          <div style=\"display:flex;gap:4px;padding:4px;background:#EAF2FA;borderRadius:999px\">\n            <sc-for list=\"{{ regions }}\" as=\"r\" hint-placeholder-count=\"2\">\n              <button sc-camel-on-click=\"{{ r.pick }}\" style=\"padding:11px 22px;border:0;cursor:pointer;borderRadius:999px;fontFamily:'Sora',sans-serif;fontSize:14.5px;fontWeight:600;background:{{ r.bg }};color:{{ r.fg }}\">{{ r.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"fontSize:14px;color:#5C6B63\">Updated every 15 minutes<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"maxWidth:1180px;margin:0 auto;padding:28px 20px 0\">\n          <div style=\"display:flex;gap:28px;borderBottom:1px solid #DDE5DF\">\n            <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ t.pick }}\" style=\"background:transparent;border:0;cursor:pointer;padding:0 0 14px;fontFamily:'Sora',sans-serif;fontSize:17px;fontWeight:600;letterSpacing:-0.015em;color:{{ t.fg }}\">\n                {{ t.label }}\n                <div style=\"marginTop:12px;height:2px;borderRadius:2px;background:#2B72B8;opacity:{{ t.bar }}\"><\u002Fdiv>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"maxWidth:1180px;margin:0 auto;padding:28px 20px 0\">\n          <sc-if value=\"{{ showNotable }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:grid;gridTemplateColumns:repeat(auto-fit,minmax(290px,1fr));gap:16px\">\n              <sc-for list=\"{{ notable }}\" as=\"s\" hint-placeholder-count=\"3\">\n                <div style=\"background:#fff;border:1px solid #DDE5DF;borderRadius:16px;padding:26px;borderTop:3px solid #F2B705\">\n                  <div style=\"fontFamily:'Sora',sans-serif;fontSize:21px;fontWeight:600;letterSpacing:-0.025em;lineHeight:1.2\">{{ s.species }}<\u002Fdiv>\n                  <div style=\"marginTop:5px;fontSize:15px;fontStyle:italic;color:#5C6B63\">{{ s.sci }}<\u002Fdiv>\n                  <div style=\"marginTop:18px;display:grid;gap:7px;fontSize:15.5px;color:#41514A\">\n                    <div>{{ s.loc }}<\u002Fdiv>\n                    <div style=\"color:#5C6B63\">{{ s.obs }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"marginTop:18px;display:flex;gap:8px;alignItems:center\">\n                    <span style=\"padding:4px 11px;background:#E8F1EA;color:#0F7A3E;borderRadius:999px;fontFamily:'Sora',sans-serif;fontSize:13px;fontWeight:600\">{{ s.count }} birds<\u002Fspan>\n                    <span style=\"padding:4px 11px;background:#EAF2FA;color:#1F5A93;borderRadius:999px;fontFamily:'Sora',sans-serif;fontSize:13px;fontWeight:600\">{{ s.status }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ showRecent }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#fff;border:1px solid #DDE5DF;borderRadius:16px;overflow:hidden\">\n              <sc-for list=\"{{ recent }}\" as=\"s\" hint-placeholder-count=\"6\">\n                <div style=\"padding:20px 24px;borderBottom:1px solid #E7EDE9;display:flex;flexWrap:wrap;gap:12px;alignItems:baseline;justifyContent:space-between\">\n                  <div style=\"display:flex;flexWrap:wrap;gap:14px;alignItems:baseline\">\n                    <div style=\"fontFamily:'Sora',sans-serif;fontSize:18px;fontWeight:600;letterSpacing:-0.02em\">{{ s.species }}<\u002Fdiv>\n                    <div style=\"fontSize:15.5px;color:#5C6B63\">{{ s.loc }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;gap:14px;alignItems:center\">\n                    <span style=\"padding:3px 10px;background:#E8F1EA;color:#0F7A3E;borderRadius:999px;fontFamily:'Sora',sans-serif;fontSize:12.5px;fontWeight:600\">{{ s.count }}<\u002Fspan>\n                    <span style=\"fontSize:14px;color:#5C6B63\">{{ s.obs }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ showHotspots }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#fff;border:1px solid #DDE5DF;borderRadius:16px;overflow:hidden\">\n              <sc-for list=\"{{ hotspots }}\" as=\"h\" hint-placeholder-count=\"5\">\n                <div style=\"borderBottom:1px solid #E7EDE9\">\n                  <button sc-camel-on-click=\"{{ h.toggle }}\" style=\"width:100%;background:transparent;border:0;cursor:pointer;textAlign:left;padding:22px 24px;display:flex;flexWrap:wrap;gap:14px;alignItems:center;justifyContent:space-between\" style-hover=\"background:#F5F8F6\">\n                    <div style=\"display:flex;gap:16px;alignItems:center\">\n                      <div style=\"width:30px;height:30px;flexShrink:0;borderRadius:99px;background:#EAF2FA;display:flex;alignItems:center;justifyContent:center;fontFamily:'Sora',sans-serif;fontSize:13.5px;fontWeight:700;color:#4E6B5C\">{{ h.rank }}<\u002Fdiv>\n                      <div style=\"fontFamily:'Sora',sans-serif;fontSize:18px;fontWeight:600;letterSpacing:-0.02em;color:#16241D\">{{ h.name }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"display:flex;gap:26px;alignItems:center\">\n                      <div>\n                        <div style=\"fontFamily:'Sora',sans-serif;fontSize:19px;fontWeight:700;letterSpacing:-0.03em;color:#2B72B8\">{{ h.species }}<\u002Fdiv>\n                        <div style=\"fontSize:13px;color:#5C6B63\">species<\u002Fdiv>\n                      <\u002Fdiv>\n                      <div>\n                        <div style=\"fontFamily:'Sora',sans-serif;fontSize:19px;fontWeight:700;letterSpacing:-0.03em;color:#17924C\">{{ h.checklists }}<\u002Fdiv>\n                        <div style=\"fontSize:13px;color:#5C6B63\">checklists<\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"fontFamily:'Sora',sans-serif;fontSize:22px;color:#2B72B8;transform:rotate({{ h.rot }}deg);transition:transform .18s ease\">+<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fbutton>\n                  <sc-if value=\"{{ h.open }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"borderTop:1px solid #E7EDE9;background:#F5F8F6;padding:22px 24px 26px\">\n                      <div style=\"fontFamily:'Sora',sans-serif;fontSize:12px;fontWeight:600;letterSpacing:0.09em;textTransform:uppercase;color:#4E6B5C;marginBottom:16px\">Recorded here<\u002Fdiv>\n                      <div style=\"display:flex;flexWrap:wrap;gap:8px\">\n                        <sc-for list=\"{{ h.speciesList }}\" as=\"sp\" hint-placeholder-count=\"12\">\n                          <span style=\"padding:7px 13px;background:#fff;border:1px solid #DDE5DF;borderRadius:999px;fontSize:14.5px;color:#2B3A33\">{{ sp }}<\u002Fspan>\n                        <\u002Fsc-for>\n                        <span style=\"padding:7px 13px;background:#EAF2FA;borderRadius:999px;fontFamily:'Sora',sans-serif;fontSize:14px;fontWeight:600;color:#1F5A93\">+{{ h.more }} more on the full list<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"maxWidth:1180px;margin:0 auto;padding:clamp(48px,7vw,84px) 20px 0\">\n          <div style=\"background:#fff;border:1px solid #DDE5DF;borderRadius:20px;padding:clamp(28px,4vw,44px)\">\n            <div style=\"fontFamily:'Sora',sans-serif;fontSize:12px;fontWeight:600;letterSpacing:0.09em;textTransform:uppercase;color:#1F5A93;marginBottom:14px\">Where can I see it now?<\u002Fdiv>\n            <h2 style=\"margin:0;maxWidth:26ch;fontFamily:'Sora',sans-serif;fontSize:clamp(24px,3.2vw,34px);lineHeight:1.1;letterSpacing:-0.03em;fontWeight:700\">Look up the nearest recent sighting of a species<\u002Fh2>\n            <p style=\"margin:12px 0 24px;maxWidth:52ch;fontSize:16.5px;lineHeight:1.55;color:#41514A\">Type a species name. Results are the closest checklists in the last two weeks, with distance from Hyderabad.<\u002Fp>\n\n            <div style=\"maxWidth:520px;position:relative\">\n              <input type=\"text\" value=\"{{ query }}\" sc-camel-on-change=\"{{ onQuery }}\" placeholder=\"e.g. Indian Skimmer\" style=\"width:100%;padding:15px 17px;border:1px solid #DDE5DF;borderRadius:12px;fontFamily:'Source Sans 3',sans-serif;fontSize:16.5px;background:#F5F8F6;color:#16241D\">\n              <sc-for list=\"{{ suggestions }}\" as=\"s\" hint-placeholder-count=\"0\">\n                <button sc-camel-on-click=\"{{ s.pick }}\" style=\"width:100%;marginTop:6px;padding:13px 16px;background:#fff;border:1px solid #DDE5DF;borderRadius:10px;cursor:pointer;textAlign:left;fontFamily:'Source Sans 3',sans-serif;fontSize:16px;color:#16241D\" style-hover=\"background:#EAF2FA\">{{ s.name }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ hasSpecies }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"marginTop:28px\">\n                <div style=\"display:flex;flexWrap:wrap;gap:14px;alignItems:baseline;justifyContent:space-between;marginBottom:16px\">\n                  <div style=\"fontFamily:'Sora',sans-serif;fontSize:21px;fontWeight:600;letterSpacing:-0.025em\">Nearest {{ speciesName }}<\u002Fdiv>\n                  <button sc-camel-on-click=\"{{ clearSpecies }}\" style=\"background:transparent;border:0;cursor:pointer;padding:0;fontFamily:'Sora',sans-serif;fontSize:14.5px;fontWeight:600;color:#0F7A3E\">Clear<\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"display:grid;gridTemplateColumns:repeat(auto-fit,minmax(240px,1fr));gap:2px;background:#DDE5DF;border:1px solid #DDE5DF;borderRadius:14px;overflow:hidden\">\n                  <sc-for list=\"{{ nearest }}\" as=\"n\" hint-placeholder-count=\"3\">\n                    <div style=\"background:#F5F8F6;padding:22px\">\n                      <div style=\"fontFamily:'Sora',sans-serif;fontSize:26px;fontWeight:700;letterSpacing:-0.035em;color:#17924C\">{{ n.dist }}<\u002Fdiv>\n                      <div style=\"marginTop:10px;fontFamily:'Sora',sans-serif;fontSize:16.5px;fontWeight:600;letterSpacing:-0.02em;lineHeight:1.25\">{{ n.loc }}<\u002Fdiv>\n                      <div style=\"marginTop:10px;display:flex;gap:8px;alignItems:center\">\n                        <span style=\"padding:3px 10px;background:#EAF2FA;color:#1F5A93;borderRadius:999px;fontFamily:'Sora',sans-serif;fontSize:12.5px;fontWeight:600\">{{ n.count }}<\u002Fspan>\n                        <span style=\"fontSize:13.5px;color:#5C6B63\">{{ n.when }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"maxWidth:1180px;margin:0 auto;padding:clamp(32px,4vw,48px) 20px clamp(60px,8vw,96px)\">\n          <div style=\"background:#16241D;borderRadius:20px;padding:clamp(28px,4vw,44px);color:#fff\">\n            <div style=\"fontFamily:'Sora',sans-serif;fontSize:12px;fontWeight:600;letterSpacing:0.09em;textTransform:uppercase;color:#F2B705;marginBottom:14px\">On this day · {{ todayLabel }}<\u002Fdiv>\n            <h2 style=\"margin:0;maxWidth:24ch;fontFamily:'Sora',sans-serif;fontSize:clamp(24px,3.2vw,34px);lineHeight:1.1;letterSpacing:-0.03em;fontWeight:700;color:#fff\">What Birders saw on this date in past years<\u002Fh2>\n            <div style=\"marginTop:28px;display:grid;gap:2px;background:rgba(255,255,255,0.12);borderRadius:14px;overflow:hidden\">\n              <sc-for list=\"{{ onThisDay }}\" as=\"o\" hint-placeholder-count=\"5\">\n                <div style=\"background:#16241D;padding:20px 22px;display:flex;flexWrap:wrap;gap:16px;alignItems:baseline;justifyContent:space-between\">\n                  <div style=\"display:flex;gap:20px;alignItems:baseline\">\n                    <div style=\"fontFamily:'Sora',sans-serif;fontSize:20px;fontWeight:700;letterSpacing:-0.03em;color:#F2B705;minWidth:60px\">{{ o.year }}<\u002Fdiv>\n                    <div>\n                      <div style=\"fontFamily:'Sora',sans-serif;fontSize:18px;fontWeight:600;letterSpacing:-0.02em;color:#fff\">{{ o.species }}<\u002Fdiv>\n                      <div style=\"marginTop:4px;fontSize:15px;color:rgba(255,255,255,0.7)\">{{ o.loc }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"padding:4px 11px;background:rgba(255,255,255,0.12);color:#fff;borderRadius:999px;fontFamily:'Sora',sans-serif;fontSize:12.5px;fontWeight:600\">{{ o.tally }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ══════════ GALLERY ══════════ -->\n    <sc-if value=\"{{ isGallery }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"maxWidth:1180px;margin:0 auto;padding:clamp(40px,6vw,68px) 20px 0\">\n          <div style=\"fontFamily:'Sora',sans-serif;fontSize:12.5px;fontWeight:600;letterSpacing:0.1em;textTransform:uppercase;color:#2B72B8\">Gallery<\u002Fdiv>\n          <h1 style=\"margin:14px 0 0;fontFamily:'Sora',sans-serif;fontSize:clamp(34px,6vw,62px);lineHeight:1.04;letterSpacing:-0.035em;fontWeight:700\">From members' cameras<\u002Fh1>\n          <p style=\"margin:20px 0 0;maxWidth:56ch;fontSize:clamp(17px,2.1vw,20px);lineHeight:1.55;color:#41514A\">Newest first. Every photograph on this site was taken by a member of Deccan Birders, on a society trip or on their own time.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"maxWidth:1180px;margin:0 auto;padding:clamp(36px,5vw,52px) 20px 0\">\n          <div style=\"display:flex;gap:28px;borderBottom:1px solid #DDE5DF\">\n            <sc-for list=\"{{ galleryTabs }}\" as=\"t\" hint-placeholder-count=\"2\">\n              <button sc-camel-on-click=\"{{ t.pick }}\" style=\"background:transparent;border:0;cursor:pointer;padding:0 0 14px;fontFamily:'Sora',sans-serif;fontSize:17px;fontWeight:600;letterSpacing:-0.015em;color:{{ t.fg }}\">\n                {{ t.label }}\n                <div style=\"marginTop:12px;height:2px;borderRadius:2px;background:#2B72B8;opacity:{{ t.bar }}\"><\u002Fdiv>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ showVideos }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"maxWidth:1180px;margin:0 auto;padding:clamp(32px,4vw,48px) 20px clamp(60px,8vw,96px)\">\n            <div style=\"display:flex;flexWrap:wrap;gap:16px;alignItems:baseline;justifyContent:space-between;marginBottom:26px\">\n              <p style=\"margin:0;maxWidth:52ch;fontSize:17px;lineHeight:1.55;color:#41514A\">Trip films, webinar recordings and census footage. Everything plays on our YouTube channel — thumbnails here update automatically as new videos are uploaded.<\u002Fp>\n              <a href=\"#\" sc-camel-on-click=\"{{ noop }}\" style=\"flexShrink:0;padding:13px 24px;background:#16241D;color:#fff;borderRadius:999px;fontFamily:'Sora',sans-serif;fontSize:15px;fontWeight:600\" style-hover=\"background:#0F7A3E\">Open our YouTube channel<\u002Fa>\n            <\u002Fdiv>\n            <div style=\"display:grid;gridTemplateColumns:repeat(auto-fit,minmax(280px,1fr));gap:18px\">\n              <sc-for list=\"{{ videos }}\" as=\"v\" hint-placeholder-count=\"6\">\n                <a href=\"#\" sc-camel-on-click=\"{{ noop }}\" style=\"display:block;background:#fff;border:1px solid #DDE5DF;borderRadius:16px;overflow:hidden\" style-hover=\"borderColor:#2B72B8\">\n                  <div style=\"position:relative\">\n                    <img src=\"{{ v.thumb }}\" alt=\"{{ v.title }}\" style=\"width:100%;aspectRatio:16 / 9;objectFit:cover\">\n                    <div style=\"position:absolute;inset:0;background:linear-gradient(to top, rgba(10,20,15,0.5), rgba(10,20,15,0))\"><\u002Fdiv>\n                    <div style=\"position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:62px;height:44px;borderRadius:10px;background:#16241D;display:flex;alignItems:center;justifyContent:center\">\n                      <div style=\"width:0;height:0;borderLeft:15px solid #fff;borderTop:9px solid transparent;borderBottom:9px solid transparent;marginLeft:3px\"><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"padding:18px 20px 20px\">\n                    <div style=\"fontFamily:'Sora',sans-serif;fontSize:17px;fontWeight:600;letterSpacing:-0.02em;lineHeight:1.3;color:#16241D\">{{ v.title }}<\u002Fdiv>\n                    <div style=\"marginTop:8px;fontSize:14.5px;color:#5C6B63\">{{ v.meta }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fa>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showPhotos }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"maxWidth:1180px;margin:0 auto;padding:clamp(32px,4vw,48px) 20px clamp(60px,8vw,96px)\">\n          <div style=\"columns:auto 280px;columnGap:16px\">\n            <sc-for list=\"{{ gallery }}\" as=\"g\" hint-placeholder-count=\"11\">\n              <figure style=\"margin:0 0 16px;breakInside:avoid;background:#fff;border:1px solid #DDE5DF;borderRadius:14px;overflow:hidden\">\n                <img src=\"{{ g.src }}\" alt=\"{{ g.title }}\" style=\"width:100%;height:auto\">\n                <figcaption style=\"padding:16px 18px 18px\">\n                  <div style=\"fontFamily:'Sora',sans-serif;fontSize:16.5px;fontWeight:600;letterSpacing:-0.02em;lineHeight:1.25\">{{ g.title }}<\u002Fdiv>\n                  <div style=\"marginTop:6px;fontSize:14.5px;color:#5C6B63\">{{ g.place }}<\u002Fdiv>\n                  <div style=\"marginTop:12px;paddingTop:12px;borderTop:1px solid #E7EDE9;fontFamily:'Sora',sans-serif;fontSize:12.5px;fontWeight:600;letterSpacing:0.03em;color:#1F5A93\">{{ g.by }}<\u002Fdiv>\n                <\u002Ffigcaption>\n              <\u002Ffigure>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"maxWidth:1180px;margin:0 auto;padding:clamp(32px,4vw,48px) 20px 0\">\n          <div style=\"background:#fff;border:1px solid #DDE5DF;borderRadius:18px;padding:clamp(26px,3.4vw,40px);display:grid;gridTemplateColumns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(28px,4vw,48px)\">\n            <div>\n              <div style=\"fontFamily:'Sora',sans-serif;fontSize:12px;fontWeight:600;letterSpacing:0.09em;textTransform:uppercase;color:#1F5A93;marginBottom:14px\">Members only<\u002Fdiv>\n              <h2 style=\"margin:0;fontFamily:'Sora',sans-serif;fontSize:clamp(22px,2.8vw,30px);lineHeight:1.12;letterSpacing:-0.025em;fontWeight:700\">Submit a photograph<\u002Fh2>\n              <p style=\"margin:12px 0 0;fontSize:16.5px;lineHeight:1.55;color:#41514A\">Your entry goes to <strong style=\"color:#16241D\">photos@deccanbirders.org<\u002Fstrong> for review. Once a committee member approves it, the photograph appears in this gallery credited to you by name.<\u002Fp>\n              <ul style=\"listStyle:none;margin:20px 0 0;display:grid;gap:10px\">\n                <sc-for list=\"{{ submitNotes }}\" as=\"n\" hint-placeholder-count=\"3\">\n                  <li style=\"display:flex;gap:11px;alignItems:flex-start;fontSize:15.5px;lineHeight:1.5;color:#5C6B63\">\n                    <div style=\"marginTop:7px;width:6px;height:6px;flexShrink:0;borderRadius:99px;background:#F2B705\"><\u002Fdiv>\n                    {{ n }}\n                  <\u002Fli>\n                <\u002Fsc-for>\n              <\u002Ful>\n            <\u002Fdiv>\n            <div style=\"display:grid;gap:14px;alignContent:start\">\n              <div style=\"display:grid;gridTemplateColumns:repeat(auto-fit,minmax(150px,1fr));gap:14px\">\n                <label style=\"display:grid;gap:7px\">\n                  <span style=\"fontFamily:'Sora',sans-serif;fontSize:13px;fontWeight:600;color:#41514A\">Photographer name<\u002Fspan>\n                  <input type=\"text\" placeholder=\"As it should be credited\" style=\"padding:13px 15px;border:1px solid #DDE5DF;borderRadius:10px;fontFamily:'Source Sans 3',sans-serif;fontSize:16px;background:#F5F8F6;color:#16241D\">\n                <\u002Flabel>\n                <label style=\"display:grid;gap:7px\">\n                  <span style=\"fontFamily:'Sora',sans-serif;fontSize:13px;fontWeight:600;color:#41514A\">Email<\u002Fspan>\n                  <input type=\"email\" placeholder=\"you@example.com\" style=\"padding:13px 15px;border:1px solid #DDE5DF;borderRadius:10px;fontFamily:'Source Sans 3',sans-serif;fontSize:16px;background:#F5F8F6;color:#16241D\">\n                <\u002Flabel>\n              <\u002Fdiv>\n              <div style=\"display:grid;gridTemplateColumns:repeat(auto-fit,minmax(150px,1fr));gap:14px\">\n                <label style=\"display:grid;gap:7px\">\n                  <span style=\"fontFamily:'Sora',sans-serif;fontSize:13px;fontWeight:600;color:#41514A\">Species<\u002Fspan>\n                  <input type=\"text\" placeholder=\"e.g. Indian Roller\" style=\"padding:13px 15px;border:1px solid #DDE5DF;borderRadius:10px;fontFamily:'Source Sans 3',sans-serif;fontSize:16px;background:#F5F8F6;color:#16241D\">\n                <\u002Flabel>\n                <label style=\"display:grid;gap:7px\">\n                  <span style=\"fontFamily:'Sora',sans-serif;fontSize:13px;fontWeight:600;color:#41514A\">Where and when<\u002Fspan>\n                  <inpu ;letterSpacing:0.1em;textTransform:uppercase;color:#2B72B8\">Contact<\u002Fdiv>\n          <h1 style=\"margin:14px 0 0;fontFamily:'Sora',sans-serif;fontSize:clamp(34px,6vw,62px);lineHeight:1.04;letterSpacing:-0.035em;fontWeight:700\">Get in touch<\u002Fh1>\n        <\u002Fdiv>\n\n        <div style=\"maxWidth:1180px;margin:0 auto;padding:clamp(36px,5vw,56px) 20px clamp(60px,8vw,96px);display:grid;gridTemplateColumns:repeat(auto-fit,minmax(300px,1fr));gap:20px;alignItems:start\">\n          <div style=\"background:#fff;border:1px solid #DDE5DF;borderRadius:18px;padding:clamp(26px,3.2vw,38px)\">\n            <h2 style=\"margin:0;fontFamily:'Sora',sans-serif;fontSize:clamp(22px,2.8vw,28px);letterSpacing:-0.025em;fontWeight:700\">Send us a message<\u002Fh2>\n            <p style=\"margin:10px 0 24px;fontSize:16.5px;lineHeight:1.55;color:#41514A\">Questions about membership, trips or a bird you can't identify.<\u002Fp>\n            <div style=\"display:grid;gap:14px\">\n              <label style=\"display:grid;gap:7px\">\n                <span style=\"fontFamily:'Sora',sans-serif;fontSize:13px;fontWeight:600;color:#41514A\">Name<\u002Fspan>\n                <input type=\"text\" placeholder=\"Your name\" style=\"padding:13px 15px;border:1px solid #DDE5DF;borderRadius:10px;fontFamily:'Source Sans 3',sans-serif;fontSize:16px;background:#F5F8F6;color:#16241D\">\n              <\u002Flabel>\n              <label style=\"display:grid;gap:7px\">\n                <span style=\"fontFamily:'Sora',sans-serif;fontSize:13px;fontWeight:600;color:#41514A\">Email<\u002Fspan>\n                <input type=\"email\" placeholder=\"you@example.com\" style=\"padding:13px 15px;border:1px solid #DDE5DF;borderRadius:10px;fontFamily:'Source Sans 3',sans-serif;fontSize:16px;background:#F5F8F6;color:#16241D\">\n              <\u002Flabel>\n              <label style=\"display:grid;gap:7px\">\n                <span style=\"fontFamily:'Sora',sans-serif;fontSize:13px;fontWeight:600;color:#41514A\">Message<\u002Fspan>\n                <textarea rows=\"5\" placeholder=\"How can we help?\" style=\"padding:13px 15px;border:1px solid #DDE5DF;borderRadius:10px;fontFamily:'Source Sans 3',sans-serif;fontSize:16px;background:#F5F8F6;color:#16241D;resize:vertical\"><\u002Ftextarea>\n              <\u002Flabel>\n              <button style=\"marginTop:6px;justifySelf:start;padding:14px 28px;background:#2B72B8;color:#fff;border:0;borderRadius:999px;cursor:pointer;fontFamily:'Sora',sans-serif;fontSize:15.5px;fontWeight:600\" style-hover=\"background:#1F5A93\">Send message<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;gap:20px\">\n            <div style=\"background:#fff;border:1px solid #DDE5DF;borderRadius:18px;padding:clamp(26px,3.2vw,38px)\">\n              <h2 style=\"margin:0 0 18px;fontFamily:'Sora',sans-serif;fontSize:clamp(20px,2.4vw,24px);letterSpacing:-0.025em;fontWeight:700\">Phone and WhatsApp<\u002Fh2>\n              <div style=\"display:grid;gap:14px;fontSize:16.5px;lineHeight:1.5\">\n                <div>\n                  <div style=\"fontFamily:'Sora',sans-serif;fontSize:12px;fontWeight:600;letterSpacing:0.08em;textTransform:uppercase;color:#4E6B5C;marginBottom:4px\">Enquiries<\u002Fdiv>\n                  <div style=\"color:#41514A\">+91 XXXXX XXXXX<\u002Fdiv>\n                <\u002Fdiv>\n                <div>\n                  \n                  \n                <\u002Fdiv>\n                <div>\n                  <div style=\"fontFamily:'Sora',sans-serif;fontSize:12px;fontWeight:600;letterSpacing:0.08em;textTransform:uppercase;color:#4E6B5C;marginBottom:4px\">Email<\u002Fdiv>\n                  <a href=\"mailto:info@deccanbirders.org\">info@deccanbirders.org<\u002Fa>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#EAF2FA;borderRadius:18px;padding:clamp(26px,3.2vw,38px)\">\n              <div style=\"fontFamily:'Sora',sans-serif;fontSize:12px;fontWeight:600;letterSpacing:0.09em;textTransform:uppercase;color:#4E6B5C;marginBottom:14px\">Volunteer · Report a sighting<\u002Fdiv>\n              <h2 style=\"margin:0;fontFamily:'Sora',sans-serif;fontSize:clamp(20px,2.4vw,24px);letterSpacing:-0.025em;fontWeight:700\">Seen something unusual?<\u002Fh2>\n              <p style=\"margin:10px 0 22px;fontSize:16.5px;lineHeight:1.55;color:#41514A\">Tell us what you saw, where and when. You can also put your hand up for the winter waterfowl census or a school outreach session.<\u002Fp>\n              <div style=\"display:grid;gap:12px\">\n                <label style=\"display:grid;gap:7px\">\n                  <span style=\"fontFamily:'Sora',sans-serif;fontSize:13px;fontWeight:600;color:#41514A\">Species and location<\u002Fspan>\n                  <input type=\"text\" placeholder=\"e.g. Indian Skimmer, Manjeera\" style=\"padding:13px 15px;border:1px solid #DDE5DF;borderRadius:10px;fontFamily:'Source Sans 3',sans-serif;fontSize:16px;background:#fff;color:#16241D\">\n                <\u002Flabel>\n                <label style=\"display:grid;gap:7px\">\n                  <span style=\"fontFamily:'Sora',sans-serif;fontSize:13px;fontWeight:600;color:#41514A\">I'd like to help with<\u002Fspan>\n                  <sc-raw-select style=\"padding:13px 15px;border:1px solid #DDE5DF;borderRadius:10px;fontFamily:'Source Sans 3',sans-serif;fontSize:16px;background:#fff;color:#16241D\">\n                    <option>Reporting a sighting only<\u002Foption>\n                    <option>Annual waterfowl census<\u002Foption>\n                    <option>Field trip coordination<\u002Foption>\n                    <option>School and college outreach<\u002Foption>\n                    <option>PITTA newsletter<\u002Foption>\n                  <\u002Fsc-raw-select>\n                <\u002Flabel>\n                <button style=\"marginTop:6px;justifySelf:start;padding:14px 28px;background:#16241D;color:#fff;border:0;borderRad
